[package]
name = "heartburn"
version = "0.1.0"
edition = "2021"
description = "CARDIAC, the 1968 Bell Labs cardboard computer, stupid fast"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/StrangeQuery/heartburn"
readme = "README.md"
keywords = ["cardiac", "emulator", "interpreter", "retrocomputing", "education"]
categories = ["emulators", "command-line-utilities"]

[lib]
name = "heartburn"
path = "src/lib.rs"

[[bin]]
name = "heartburn"
path = "src/main.rs"

[features]
# Marks a debugger page draws from (cells run, cells used as data, the last instruction): heartburn.wasm turns it
# on; native HEARTBURN is built without it, its machine exactly as fast as before.
marks = []

[profile.release]
debug = false
