[package]
name = "heartburn"
version = "0.1.3"
edition = "2021"
description = "The world's fastest CARDIAC runtime, along with profiling and diagnostic tools."
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/StrangeQuery/heartburn"
homepage = "https://lab.strangequery.com/cardiac/"
readme = "HEARTBURN.md"
keywords = ["cardiac", "emulator", "interpreter", "retrocomputing", "education"]
categories = ["emulators", "command-line-utilities"]
# what crates.io gets: the library and the programs' source (src/tools, src/bin), the README and the licence
include = ["/src", "/HEARTBURN.md", "/LICENSE"]

[lib]
name = "heartburn"
path = "src/lib.rs"

[features]
# Marks a debugger page draws from (cells run, cells used as data, the last instruction), for a WebAssembly build
# of the machine to turn on; burn, carc and ekg are built without it, the machine exactly as fast as before.
marks = []
# The programs: `heartburn::tools::{burn, carc, ekg}`, and the binaries burn, carc and ekg (and heartburn-tools).
# Off by default, so a program using heartburn as a library gets the library alone.
tools = []

# run a deck: `cargo build --release --features tools --bins` puts burn, carc and ekg in target/release/
[[bin]]
name = "burn"
path = "src/bin/burn.rs"
required-features = ["tools"]

# the assembler: a listing in six columns made into a deck for burn
[[bin]]
name = "carc"
path = "src/bin/carc.rs"
required-features = ["tools"]

# the debugger and profiler: step a listing or a deck, breakpoints and watches; or count where its instructions go
[[bin]]
name = "ekg"
path = "src/bin/ekg.rs"
required-features = ["tools"]

# The toolchain the tests use: run a listing, deck <-> listing. Not in a release.
[[bin]]
name = "heartburn-tools"
path = "src/bin/heartburn-tools.rs"
required-features = ["tools"]

[[test]]
name = "burn"
required-features = ["tools"]

[[test]]
name = "carc"
required-features = ["tools"]

[[test]]
name = "ekg"
required-features = ["tools"]

[[test]]
name = "emit"
required-features = ["tools"]

[[test]]
name = "manual"
required-features = ["tools"]

[profile.release]
debug = false
