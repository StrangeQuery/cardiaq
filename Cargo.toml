[workspace]
members = [".", "tools"]
# `cargo build --release` here builds the library and the programs: burn, carc and ekg end up in target/release/
default-members = [".", "tools"]

[package]
name = "heartburn"
version = "0.1.1"
edition = "2021"
description = "The world's fastest CARDIAC emulator, as a library."
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/StrangeQuery/cardiaq"
homepage = "https://lab.strangequery.com/cardiac/"
readme = "HEARTBURN.md"
keywords = ["cardiac", "emulator", "interpreter", "retrocomputing", "education"]
categories = ["emulators"]
# what crates.io gets: the library alone (the programs are in tools/, which is never published)
include = ["/src", "/HEARTBURN.md", "/LICENSE"]

[lib]
name = "heartburn"
path = "src/lib.rs"

[features]
# Marks a debugger page draws from (cells run, cells used as data, the last instruction), for a WebAssembly build
# of the machine to turn on; burn, carc and ekg are built without it, the machine exactly as fast as before.
marks = []

[profile.release]
debug = false
