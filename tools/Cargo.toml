# The cardiaq SDK's programs: burn, carc and ekg. On crates.io as cardiaq (`cargo install cardiaq`), and built by
# the release workflow into archives for each platform. The library they are built on is heartburn.
[package]
name = "cardiaq"
version = "0.1.0"
edition = "2021"
description = "CARDIAC tools: burn, a stupid fast runtime; carc, the assembler; ekg, the debugger and profiler"
rust-version = "1.97"
license = "MIT"
repository = "https://github.com/StrangeQuery/cardiaq"
homepage = "https://lab.strangequery.com/cardiac/"
documentation = "https://lab.strangequery.com/cardiac/"
readme = "../README.md"
keywords = ["cardiac", "emulator", "assembler", "debugger", "retrocomputing"]
categories = ["emulators", "command-line-utilities"]
# what crates.io gets: the programs' source and the licence
include = ["/src", "/LICENSE"]

[[bin]]
name = "burn"
path = "src/main.rs"

# the assembler: a listing in six columns made into a deck for burn
[[bin]]
name = "carc"
path = "src/bin/carc.rs"

# the debugger and profiler: step a listing or a deck, breakpoints and watches; or count where its instructions go
[[bin]]
name = "ekg"
path = "src/bin/ekg.rs"

# The toolchain, until it has its own repo: run a listing, deck <-> listing. Built only with the
# `tools` feature (the tests build it).
[[bin]]
name = "heartburn-tools"
path = "src/bin/tools.rs"
required-features = ["tools"]

[features]
# heartburn-tools, the toolchain's commands (see [[bin]] above)
tools = []

[dependencies]
heartburn = { version = "0.1.0", path = ".." }
