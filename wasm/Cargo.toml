[package]
name = "heartburn-wasm"
version = "0.1.0"
edition = "2021"
description = "HEARTBURN as WebAssembly: the CARDIAC machine a web page holds"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
heartburn = { path = ".." }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

# the native side of the wasm tests (test/compare.py): a session script run on cardiac::Machine
[[bin]]
name = "session"
path = "tools/session.rs"
